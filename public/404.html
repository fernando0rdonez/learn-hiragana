<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>かな道 — ¡Te invitaron a un reto!</title>

    <!-- Open Graph / previews de link (WhatsApp, Telegram, etc.). Esta es la
    página que GitHub Pages sirve de verdad para /compete/CODE (ver el truco
    de redirect más abajo), así que estos tags son los que arma el preview
    de la invitación al compartir el link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="かな道" />
    <meta property="og:title" content="かな道 — ¡Te han invitado a un reto!" />
    <meta property="og:description" content="Alguien te desafió a un reto de hiragana. Toca el link para aceptar y competir en tiempo real 🎌" />
    <meta property="og:image" content="https://fernando0rdonez.github.io/learn-hiragana/icon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="かな道 — ¡Te han invitado a un reto!" />
    <meta name="twitter:description" content="Alguien te desafió a un reto de hiragana. Toca el link para aceptar y competir en tiempo real 🎌" />

    <script>
      // GitHub Pages sirve archivos estáticos: una ruta como
      // /learn-hiragana/compete/CODE (el link de invitación a un reto,
      // ver src/views/CompetitionCreateView.tsx) no existe como archivo,
      // así que GitHub responde con este 404 en vez de servir la SPA.
      // Truco estándar (https://github.com/rafgraph/spa-github-pages):
      // redirige codificando la ruta real en la query string; index.html
      // la decodifica y restaura antes de montar React.
      var pathSegmentsToKeep = 1; // "/learn-hiragana"
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
