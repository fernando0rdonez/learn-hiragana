<!--
  Plantilla "Magic link or OTP" (docs/BACKLOG.md #15) — se envía cuando un
  email YA confirmado vuelve a iniciar sesión. La primera vez que un email
  inicia sesión, Supabase usa "Confirm signup" en su lugar
  (ver confirm-signup.html); las dos deben mostrar {{ .Token }} o el
  código nunca llega para ese caso.

  Pegar en: Authentication → Emails → Magic link or OTP → Source
-->
<div style="background-color:#FAFAF9; padding:40px 16px; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <div style="max-width:420px; margin:0 auto; background-color:#ffffff; border:1px solid #E7E5E4; border-radius:24px; padding:40px 32px; text-align:center;">

    <div style="font-size:24px; font-weight:800; letter-spacing:-0.02em; margin-bottom:24px;">
      <span style="color:#1A1A2E;">かな</span><span style="color:#7B4FD4;">道</span>
    </div>

    <div style="font-size:32px; line-height:1; margin-bottom:16px;">🦊</div>

    <p style="font-size:15px; color:#44403C; margin:0 0 8px;">Tu código de acceso es:</p>

    <div style="display:inline-block; margin:12px 0 20px; padding:16px 28px; background:linear-gradient(135deg, #7B4FD4, #5533A8); border-radius:16px;">
      <span style="font-family:'SF Mono', 'Courier New', monospace; font-size:32px; font-weight:700; letter-spacing:0.3em; color:#ffffff;">{{ .Token }}</span>
    </div>

    <p style="font-size:13px; color:#8B7FA8; margin:0 0 28px;">
      Ingresa este código en かな道 para sincronizar tu progreso.<br>
      Expira en 1 hora.
    </p>

    <div style="border-top:1px solid #E7E5E4; padding-top:20px;">
      <p style="font-size:12px; color:#A8A29E; margin:0;">
        Si no pediste este código, puedes ignorar este correo — tu cuenta está segura.
      </p>
    </div>
  </div>

  <p style="max-width:420px; margin:20px auto 0; text-align:center; font-size:11px; color:#D6D3D1;">
    {{ .Email }} · かな道
  </p>
</div>
