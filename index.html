<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4338ca" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- TODO: replace /icon.svg above with a 180x180 PNG for full iOS home screen icon support -->
    <link rel="manifest" href="/manifest.json" />
    <title>かな道</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Deshace el redirect de 404.html (GitHub Pages no sirve rutas como
      // /learn-hiragana/compete/CODE — ver public/404.html) restaurando la
      // URL real ANTES de montar React, para que App.tsx siga leyendo
      // window.location.pathname sin saber que hubo un redirect de por medio.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) { return s.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
